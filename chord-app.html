<style>
:root {
  --bg:#FDFCF8; --surf:#F5EDE0; --brd:#E4D4BC; --acc:#E8960A; --teal:#0B9488;
  --text:#1A1208; --muted:#8B7A60; --gold:#C97D08; --card:#ffffff; --ctrl-bg:#FAF4EB;
  --nav-bg:rgba(253,252,248,0.94); --scroll-thumb:#d0c4b4;
}
body.dark {
  --bg:#18150F; --surf:#221E14; --brd:#3A3020; --acc:#E8960A; --teal:#0FA898;
  --text:#EDE4D0; --muted:#9A8B6E; --gold:#D98E10; --card:#272116; --ctrl-bg:#201C12;
  --nav-bg:rgba(24,21,15,0.94); --scroll-thumb:#4A3E2A;
}
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'DM Sans',-apple-system,sans-serif; background:var(--bg); color:var(--text); transition:background .25s,color .25s; }
@media (min-width:1024px){ body{ max-width:1280px; margin:0 auto; } }

.site-nav { display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px 16px; background:var(--nav-bg); border-bottom:1px solid var(--brd);
  position:sticky; top:0; z-index:20; backdrop-filter:blur(8px); }
.site-logo { font-family:'Prompt',sans-serif; font-weight:900; font-size:18px; letter-spacing:-.5px; color:var(--text); text-decoration:none; }
.site-logo span { color:var(--acc); }
.site-tools { display:flex; gap:8px; flex-wrap:wrap; }
.site-tool { font-size:.82rem; text-decoration:none; padding:6px 13px; border-radius:100px;
  border:1px solid var(--brd); color:var(--muted); background:var(--card); white-space:nowrap; }
.site-tool.on { background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700; }

.hdr { display:flex; align-items:flex-start; justify-content:space-between; gap:8px 12px;
  flex-wrap:wrap; padding:12px 16px 8px; }
.hdr-name { font-size:24px; font-weight:900; color:var(--text); letter-spacing:-.5px; line-height:1.1; font-family:'Prompt',sans-serif; }
.hdr-name .acc { color:var(--acc); }
.hdr-sub { font-size:13px; color:var(--muted); margin-top:4px; letter-spacing:.5px; }
.hdr-right { display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
.btn-row { display:flex; gap:6px; }
.icon-btn { border:1.5px solid var(--brd); background:var(--card); color:var(--muted);
  border-radius:8px; padding:6px 11px; font-size:12px; font-weight:700; cursor:pointer;
  font-family:'DM Sans',sans-serif; transition:all .15s; }
.icon-btn.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.icon-btn.lang-on { background:var(--text); border-color:var(--text); color:var(--bg); }

.sel-wrap { padding:6px 16px 10px; background:var(--ctrl-bg); border-top:1px solid var(--brd); border-bottom:1px solid var(--brd); }
.sel-lbl { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:8px 0 5px; }
.pill-row { display:flex; gap:6px; flex-wrap:wrap; }
.pill { border:1.5px solid var(--brd); background:var(--card); color:var(--text);
  border-radius:100px; padding:6px 13px; font-size:13px; font-weight:700; cursor:pointer;
  font-family:'DM Sans',sans-serif; transition:all .15s; }
.pill.on { background:var(--teal); border-color:var(--teal); color:#fff; }
.pill.root-on { background:var(--acc); border-color:var(--acc); color:#fff; }
.cat-pill { font-size:12px; padding:5px 12px; }
.cat-pill.on { background:var(--text); border-color:var(--text); color:var(--bg); }

.voicing-row { display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px 0; align-items:center; }
.voicing-row .ctrl-lbl { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-right:4px; }

.fb-wrap { padding:16px; overflow-x:auto; }
.fb-wrap::-webkit-scrollbar { height:5px; }
.fb-wrap::-webkit-scrollbar-thumb { background:var(--scroll-thumb); border-radius:3px; }
.fb-wrap svg { display:block; }

.info { margin:4px 16px 18px; padding:12px 16px; background:var(--card); border:1.5px solid var(--brd); border-radius:10px; font-size:13px; }
.info-row { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.info-lbl { color:var(--muted); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; margin-right:2px; }
.badge { display:flex; align-items:center; gap:5px; background:var(--surf); border:1px solid var(--brd);
  border-radius:7px; padding:3px 9px; font-size:12px; color:var(--text); }
.bdot { width:9px; height:9px; border-radius:50%; flex-shrink:0; }
.theory-panel { margin:10px 16px 0; padding:13px 15px; background:var(--card); border:1.5px solid var(--brd); border-radius:12px; }
.theory-desc { font-size:13px; color:var(--text); line-height:1.55; }
.theory-formula { font-family:'DM Sans',monospace; font-size:12px; font-weight:700; color:var(--acc); }
</style>

<script>
// ══ NOTE / KEY DATA ═════════════════════════════════════
const NOTE_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// Roots that conventionally use flats
const FLAT_ROOTS = new Set(['F','Bb','Eb','Ab','Db','Gb']);
const ROOTS = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const ROOT_PC = { C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };

// Guitar: string pitch classes low→high E A D G B e
const OPEN = [4,9,2,7,11,4];
const SLAB = ['E','A','D','G','B','e'];

// ══ CHORD QUALITIES ═════════════════════════════════════
// itv = intervals from root (semitones); deg = degree label per interval
const CHORDS = {
  maj:  { sym:'',    itv:[0,4,7],  deg:['1','3','5'],
          en:{name:'Major', mood:'Stable, bright'}, th:{name:'เมเจอร์', mood:'มั่นคง สดใส'} },
  min:  { sym:'m',   itv:[0,3,7],  deg:['1','♭3','5'],
          en:{name:'Minor', mood:'Sad, dark'},     th:{name:'ไมเนอร์', mood:'เศร้า ขรึม'} },
  dim:  { sym:'dim', itv:[0,3,6],  deg:['1','♭3','♭5'],
          en:{name:'Diminished', mood:'Tense, unstable'}, th:{name:'ดิมินิช', mood:'ตึง ไม่นิ่ง'} },
  aug:  { sym:'aug', itv:[0,4,8],  deg:['1','3','♯5'],
          en:{name:'Augmented', mood:'Dreamy, suspended'}, th:{name:'ออกเมนเต็ด', mood:'ล่องลอย'} },
  sus2: { sym:'sus2',itv:[0,2,7],  deg:['1','2','5'],
          en:{name:'Suspended 2', mood:'Open, airy'}, th:{name:'ซัส 2', mood:'โปร่ง'} },
  sus4: { sym:'sus4',itv:[0,5,7],  deg:['1','4','5'],
          en:{name:'Suspended 4', mood:'Unresolved'}, th:{name:'ซัส 4', mood:'ค้างคา'} },
  maj7: { sym:'maj7',itv:[0,4,7,11], deg:['1','3','5','7'],
          en:{name:'Major 7', mood:'Lush, jazzy'},   th:{name:'เมเจอร์ 7', mood:'หวานละมุน แจ๊ส'} },
  m7:   { sym:'m7',  itv:[0,3,7,10], deg:['1','♭3','5','♭7'],
          en:{name:'Minor 7', mood:'Smooth, mellow'}, th:{name:'ไมเนอร์ 7', mood:'นุ่ม กลมกล่อม'} },
  dom7: { sym:'7',   itv:[0,4,7,10], deg:['1','3','5','♭7'],
          en:{name:'Dominant 7', mood:'Bluesy, tense'}, th:{name:'โดมิแนนท์ 7', mood:'บลูส์ ตึง'} },
  m7b5: { sym:'m7♭5',itv:[0,3,6,10], deg:['1','♭3','♭5','♭7'],
          en:{name:'Min 7 ♭5', mood:'Half-diminished'}, th:{name:'ไมเนอร์ 7 ♭5', mood:'ฮาล์ฟดิม'} },
  dim7: { sym:'dim7',itv:[0,3,6,9],  deg:['1','♭3','♭5','♭♭7'],
          en:{name:'Diminished 7', mood:'Very tense'}, th:{name:'ดิมินิช 7', mood:'ตึงมาก'} },
};
const QUALITY_ORDER = ['maj','min','dim','aug','sus2','sus4','maj7','m7','dom7','m7b5','dim7'];

// Two-tier categories (category row → quality pills), like Scale Explorer.
const CHORD_CATS = [
  { id:'triad', en:'Triads',    th:'พื้นฐาน',   qualities:['maj','min','dim','aug'] },
  { id:'sus',   en:'Suspended', th:'ซัสเพนเด็ด', qualities:['sus2','sus4'] },
  { id:'7th',   en:'7th',       th:'เซเวนท์',    qualities:['maj7','m7','dom7','m7b5','dim7'] },
];

// ══ CAGED VOICINGS — KEY OF C (hand-authored, verified) ══
// Absolute fret positions for C chords, as the 5 CAGED chord forms up the neck.
// frets[stringIndex] : fret number, 0 = open, null = muted.  strings [E A D G B e]
// fingers[stringIndex]: fretting-hand finger (0 = open/none).
// Each form is the open chord shape (C-A-G-E-D) transposed so it spells the C chord.
const C_VOICINGS = {
  maj: [ // C E G
    { form:'C', frets:[null,3,2,0,1,0],            fingers:[0,3,2,0,1,0] },
    { form:'A', frets:[null,3,5,5,5,3],            fingers:[0,1,3,3,3,1] },
    { form:'G', frets:[8,7,5,5,5,8],               fingers:[3,2,1,1,1,4] },
    { form:'E', frets:[8,10,10,9,8,8],             fingers:[1,3,4,2,1,1] },
    { form:'D', frets:[null,null,10,12,13,12],     fingers:[0,0,1,3,4,2] },
  ],
  min: [ // C Eb G  (practical CAGED minor forms)
    { form:'Am', frets:[null,3,5,5,4,3],           fingers:[0,1,3,4,2,1] },
    { form:'Em', frets:[8,10,10,8,8,8],            fingers:[1,3,4,1,1,1] },
    { form:'Dm', frets:[null,null,10,12,13,11],    fingers:[0,0,1,3,4,2] },
  ],
  dim: [ // C Eb Gb
    { form:'Edim', frets:[8,9,10,8,null,null],     fingers:[1,2,3,1,0,0] },
  ],
  aug: [ // C E G#
    { form:'Eaug', frets:[8,11,10,9,9,null],       fingers:[1,4,3,2,2,0] },
  ],
  sus2: [ // C D G
    { form:'Esus2', frets:[8,10,12,12,8,8],        fingers:[1,2,4,4,1,1] },
  ],
  sus4: [ // C F G
    { form:'Esus4', frets:[8,10,10,10,8,8],        fingers:[1,3,3,3,1,1] },
  ],
  maj7: [ // C E G B
    { form:'C',  frets:[null,3,2,0,0,0],           fingers:[0,3,2,0,0,0] },
    { form:'A',  frets:[null,3,5,4,5,3],           fingers:[0,1,3,2,4,1] },
    { form:'E',  frets:[8,10,9,9,8,8],             fingers:[1,4,2,3,1,1] },
  ],
  m7: [ // C Eb G Bb
    { form:'Am', frets:[null,3,5,3,4,3],           fingers:[0,1,3,1,2,1] },
    { form:'Em', frets:[8,10,8,8,8,8],             fingers:[1,3,1,1,1,1] },
    { form:'Dm', frets:[null,null,10,12,11,11],    fingers:[0,0,1,4,2,2] },
  ],
  dom7: [ // C E G Bb
    { form:'C',  frets:[null,3,2,3,1,0],           fingers:[0,3,2,4,1,0] },
    { form:'A',  frets:[null,3,5,3,5,3],           fingers:[0,1,3,1,4,1] },
    { form:'E',  frets:[8,10,8,9,8,8],             fingers:[1,3,1,2,1,1] },
  ],
  m7b5: [ // C Eb Gb Bb
    { form:'Em', frets:[8,9,8,8,null,null],        fingers:[2,3,1,1,0,0] },
    { form:'A',  frets:[null,3,4,3,4,null],        fingers:[0,1,3,2,4,0] },
  ],
  dim7: [ // C Eb Gb Bbb(=A)
    { form:'E',  frets:[8,9,7,8,null,null],        fingers:[2,3,1,2,0,0] },
    { form:'A',  frets:[null,3,4,2,4,null],        fingers:[0,2,3,1,4,0] },
  ],
};

// ══ STATE ═══════════════════════════════════════════════
// Key locked to C for now (CAGED voicings authored for C only).
const S = { root:'C', category:'triad', quality:'maj', voicing:0, disp:'int', lang:'en' };

// ══ I18N ════════════════════════════════════════════════
const LANGS = {
  en:{ dispInterval:'Interval', dispNote:'Note', dispFinger:'Finger',
       lblRoot:'Root', lblQuality:'Chord Quality', lblVoicing:'Voicing',
       notes:'Notes', mutedHint:'✕ = muted string' },
  th:{ dispInterval:'Interval', dispNote:'Note', dispFinger:'นิ้ว',
       lblRoot:'รูท', lblQuality:'ชนิดคอร์ด', lblVoicing:'รูปคอร์ด',
       notes:'โน้ต', mutedHint:'✕ = สายที่ไม่ดีด' },
};
function t(k){ return LANGS[S.lang][k]; }

// ══ HELPERS ═════════════════════════════════════════════
function rootPc(){ return ROOT_PC[S.root]; }
function useFlat(){ return FLAT_ROOTS.has(S.root) || S.root.includes('b'); }
function noteName(pc){ return (useFlat()?NOTE_FLAT:NOTE_SHARP)[((pc%12)+12)%12]; }
// Spell a note according to its chord-degree accidental: ♭ degree → flat,
// ♯ degree → sharp, natural → root's default convention.
function spellByDeg(pc, deg){
  pc = ((pc%12)+12)%12;
  if (deg && deg.includes('♭')) return NOTE_FLAT[pc];
  if (deg && deg.includes('♯')) return NOTE_SHARP[pc];
  return noteName(pc);
}
function chordPcs(){ return CHORDS[S.quality].itv.map(i=>(rootPc()+i)%12); }
function chordNotes(){ const c=CHORDS[S.quality]; return c.itv.map((i,idx)=>spellByDeg(rootPc()+i, c.deg[idx])); }
function degOf(pc){ const i=chordPcs().indexOf(((pc%12)+12)%12); return i<0?null:CHORDS[S.quality].deg[i]; }
function inChord(pc){ return chordPcs().includes(((pc%12)+12)%12); }
function isRootPc(pc){ return ((pc%12)+12)%12 === rootPc(); }

// Build the active voicings for the current quality (key C, absolute frets).
function getVoicings(){
  const list = C_VOICINGS[S.quality] || [];
  return list.map(v=>{
    const pos = [];
    const fingerMap = {};
    v.frets.forEach((fret, s)=>{
      if (fret === null) return;           // muted
      pos.push([s, [fret]]);
      fingerMap[s+':'+fret] = v.fingers[s];
    });
    const muted = v.frets.map((f,s)=>f===null?s:null).filter(s=>s!==null);
    return { key:v.form, label:v.form, pos, fingerMap, muted };
  });
}

// ══ FRETBOARD RENDER ════════════════════════════════════
const FB = { PL:46, PR:16, PT:30, PB:14, FW:46, SH:30, NR:13 };
const yOf = s => FB.PT + (5-s)*FB.SH;     // string 0 (low E) at bottom
const xOf = f => f===0 ? FB.PL-22 : FB.PL + (f-0.5)*FB.FW;

function getFbTheme(){
  const d = document.body.classList.contains('dark');
  return d ? { gradTop:'#3A2C18', gradBot:'#2C2010', nut:'#C4A060', fret:'#5A4828',
    string:'#A08050', inlay:'#6A5530', numDark:'#C8A878', numLight:'#907050', label:'#C8A878', mute:'#9A6A4A', barre:'#5A4630' }
    : { gradTop:'#f2e4ce', gradBot:'#e8d4b4', nut:'#8B6340', fret:'#c4a878',
    string:'#7a5c3a', inlay:'#c8b090', numDark:'#5a3e28', numLight:'#8a6a4a', label:'#5a3e28', mute:'#a05a30', barre:'#9c7a52' };
}

function drawFb(){
  const v = getVoicings()[S.voicing];
  const svg = document.getElementById('sv-fb');
  const fb = getFbTheme();
  const allFrets = v.pos.flatMap(p=>p[1]);
  const maxF = Math.max(4, ...allFrets);
  const startFret = 0;
  const nFrets = Math.max(5, maxF + 1);
  const W = FB.PL + nFrets*FB.FW + FB.PR;
  const H = FB.PT + 5*FB.SH + FB.PB;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  let g = `<defs><linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${fb.gradTop}"/><stop offset="100%" stop-color="${fb.gradBot}"/></linearGradient></defs>`;
  g += `<rect width="${W}" height="${H}" fill="url(#fbg)" rx="8"/>`;
  // inlays
  for (const f of [3,5,7,9,12,15]) { if(f>nFrets)continue; const x=FB.PL+(f-0.5)*FB.FW;
    if(f===12){ g+=`<circle cx="${x}" cy="${yOf(1.5)}" r="4" fill="${fb.inlay}" opacity=".6"/><circle cx="${x}" cy="${yOf(3.5)}" r="4" fill="${fb.inlay}" opacity=".6"/>`; }
    else g+=`<circle cx="${x}" cy="${yOf(2.5)}" r="4" fill="${fb.inlay}" opacity=".6"/>`; }
  // nut + frets
  const ty=yOf(5)-7, by=yOf(0)+7;
  g += `<line x1="${FB.PL}" y1="${ty}" x2="${FB.PL}" y2="${by}" stroke="${fb.nut}" stroke-width="4.5" stroke-linecap="round"/>`;
  for(let f=1; f<=nFrets; f++){ const x=FB.PL+f*FB.FW; g+=`<line x1="${x}" y1="${ty}" x2="${x}" y2="${by}" stroke="${fb.fret}" stroke-width="1.5"/>`; }
  // strings
  for(let s=0;s<6;s++){ const y=yOf(s), sw=0.6+(5-s)*0.28; g+=`<line x1="${FB.PL-22}" y1="${y}" x2="${FB.PL+nFrets*FB.FW+2}" y2="${y}" stroke="${fb.string}" stroke-width="${sw}" opacity=".55"/>`; }
  // fret numbers
  const markers=new Set([3,5,7,9,12,15]);
  for(let f=1;f<=nFrets;f++) g+=`<text x="${xOf(f)}" y="18" text-anchor="middle" font-size="10" fill="${markers.has(f)?fb.numDark:fb.numLight}" font-family="monospace">${f}</text>`;
  // string labels + muted X
  for(let s=0;s<6;s++){
    const muted = v.muted.includes(s);
    g+=`<text x="16" y="${yOf(s)+5}" text-anchor="middle" font-size="13" fill="${muted?fb.mute:fb.label}" font-family="monospace" font-weight="700">${muted?'✕':SLAB[s]}</text>`;
  }
  // barre marks: same finger on >=2 strings at the same fret → draw a capsule
  // behind the dots spanning from the highest to the lowest barred string.
  const groups = {};
  for(const [s,frets] of v.pos){
    const f = frets[0]; const fin = v.fingerMap[s+':'+f];
    if(!fin) continue;                       // skip open strings / no finger
    (groups[fin+'@'+f] = groups[fin+'@'+f] || []).push(s);
  }
  Object.entries(groups).forEach(([key,strs])=>{
    if(strs.length < 2) return;
    const fret = +key.split('@')[1];
    const x = xOf(fret);
    const yTop = yOf(Math.max(...strs));     // higher string index = upper (smaller y)
    const yBot = yOf(Math.min(...strs));     // lower string index = lower (larger y)
    const bw = FB.NR * 1.05, pad = FB.NR * 0.55;
    g += `<rect x="${x-bw/2}" y="${yTop-pad}" width="${bw}" height="${(yBot-yTop)+pad*2}" rx="${bw/2}" fill="${fb.barre}" opacity="0.85"/>`;
  });

  // dots
  for(const [s,frets] of v.pos){
    for(const f of frets){
      const x=xOf(f), y=yOf(s); const pc=(OPEN[s]+f)%12;
      const root=isRootPc(pc);
      let lbl;
      if(S.disp==='finger') lbl = String(v.fingerMap[s+':'+f] ?? (f===0?0:''));
      else if(S.disp==='note') lbl = spellByDeg(pc, degOf(pc));
      else lbl = degOf(pc) || '?';
      const fill = root ? '#E8960A' : '#0B9488';
      const stroke = root ? '#C97D08' : 'rgba(0,0,0,0.08)';
      if(root) g+=`<circle cx="${x}" cy="${y}" r="${FB.NR+4}" fill="#E8960A" opacity=".25"/>`;
      g+=`<circle cx="${x}" cy="${y}" r="${FB.NR}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
      g+=`<text x="${x}" y="${y+4.5}" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="800" fill="#fff" font-family="monospace,sans-serif">${lbl}</text>`;
    }
  }
  svg.innerHTML = g;
}

// ══ UI RENDER ═══════════════════════════════════════════
function chordLabel(){
  const c = CHORDS[S.quality];
  const nm = S.lang==='th' ? c.th.name : c.en.name;
  return { full:`${S.root}${c.sym}`, name:nm };
}

function renderHeader(){
  const cl = chordLabel();
  document.getElementById('hdr-name').innerHTML = `<span class="acc">${S.root}</span>${CHORDS[S.quality].sym} <span style="font-weight:400;font-size:.7em;color:var(--muted)">${cl.name}</span>`;
  document.getElementById('hdr-sub').textContent = chordNotes().join(' · ');
}

function renderTheory(){
  const c = CHORDS[S.quality];
  const txt = S.lang==='th' ? c.th : c.en;
  const formula = c.deg.join(' – ');
  document.getElementById('theory-panel').innerHTML =
    `<div class="theory-desc"><b>${txt.mood}</b> &nbsp;·&nbsp; <span class="theory-formula">${formula}</span></div>`;
}

function renderRootPills(){
  const el = document.getElementById('root-pills');
  const soon = S.lang==='th' ? 'คีย์อื่น เร็วๆ นี้' : 'more keys soon';
  el.innerHTML = `<button class="pill root-on">C</button>`
    + `<span style="font-size:11px;color:var(--muted);align-self:center;margin-left:6px">${soon}</span>`;
}
function renderCategoryPills(){
  const el = document.getElementById('cat-pills');
  el.innerHTML = CHORD_CATS.map(c=>{
    const nm = S.lang==='th' ? c.th : c.en;
    return `<button class="pill cat-pill ${c.id===S.category?'on':''}" data-cat="${c.id}">${nm}</button>`;
  }).join('');
  el.querySelectorAll('[data-cat]').forEach(b=>b.addEventListener('click',()=>{
    S.category = b.dataset.cat;
    const cat = CHORD_CATS.find(c=>c.id===S.category);
    S.quality = cat.qualities[0];   // jump to first quality in the new category
    S.voicing = 0;
    renderAll();
  }));
}
function renderQualityPills(){
  // Keep category in sync with the active quality.
  const cat = CHORD_CATS.find(c=>c.qualities.includes(S.quality)) || CHORD_CATS[0];
  S.category = cat.id;
  const el = document.getElementById('quality-pills');
  el.innerHTML = cat.qualities.map(q=>{
    const nm = S.lang==='th' ? CHORDS[q].th.name : CHORDS[q].en.name;
    return `<button class="pill ${q===S.quality?'on':''}" data-q="${q}">${nm}</button>`;
  }).join('');
  el.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{ S.quality=b.dataset.q; S.voicing=0; renderAll(); }));
}
function renderVoicingPills(){
  const el = document.getElementById('voicing-pills');
  const vs = getVoicings();
  if(S.voicing>=vs.length) S.voicing=0;
  el.innerHTML = vs.map((v,i)=>`<button class="pill ${i===S.voicing?'on':''}" data-v="${i}">${v.label}</button>`).join('');
  el.querySelectorAll('[data-v]').forEach(b=>b.addEventListener('click',()=>{ S.voicing=+b.dataset.v; renderVoicingPills(); drawFb(); renderInfo(); }));
}
function renderInfo(){
  const pcs=chordPcs(), degs=CHORDS[S.quality].deg;
  const badges = chordPcs().map((pc,i)=>{
    const root=isRootPc(pc);
    return `<div class="badge"><span class="bdot" style="background:${root?'#E8960A':'#0B9488'}"></span><strong>${spellByDeg(pc, degs[i])}</strong><span style="color:var(--muted)">(${degs[i]})</span></div>`;
  }).join('');
  document.getElementById('inf-fb').innerHTML =
    `<div class="info-row"><span class="info-lbl">${t('notes')}</span>${badges}</div>
     <div style="font-size:11px;color:var(--muted);margin-top:8px">${t('mutedHint')}</div>`;
}

function renderAll(){ renderHeader(); renderTheory(); renderRootPills(); renderCategoryPills(); renderQualityPills(); renderVoicingPills(); drawFb(); renderInfo(); }

// ══ DISPLAY / LANG / DARK ═══════════════════════════════
function applyLang(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const v=LANGS[S.lang][el.dataset.i18n]; if(typeof v==='string') el.textContent=v; });
  document.getElementById('langEN').classList.toggle('lang-on', S.lang==='en');
  document.getElementById('langTH').classList.toggle('lang-on', S.lang==='th');
}
document.getElementById('langEN').addEventListener('click',()=>{ S.lang='en'; applyLang(); renderAll(); });
document.getElementById('langTH').addEventListener('click',()=>{ S.lang='th'; applyLang(); renderAll(); });

function setDisp(m){ S.disp=m;
  document.getElementById('dInt').classList.toggle('on',m==='int');
  document.getElementById('dNote').classList.toggle('on',m==='note');
  document.getElementById('dFinger').classList.toggle('on',m==='finger');
  drawFb();
}
document.getElementById('dInt').addEventListener('click',()=>setDisp('int'));
document.getElementById('dNote').addEventListener('click',()=>setDisp('note'));
document.getElementById('dFinger').addEventListener('click',()=>setDisp('finger'));

function applyDark(d){
  document.body.classList.toggle('dark', d);
  document.getElementById('darkToggle').textContent = d?'🌙':'☀️';
  document.getElementById('darkToggle').classList.toggle('on', d);
  drawFb();
}
document.getElementById('darkToggle').addEventListener('click',()=>{
  const d=!document.body.classList.contains('dark');
  localStorage.setItem('twofour-dark', d?'1':'0'); applyDark(d);
});

// ══ BOOT ════════════════════════════════════════════════
const _sd=localStorage.getItem('twofour-dark');
applyDark(_sd!==null ? _sd==='1' : window.matchMedia('(prefers-color-scheme: dark)').matches);
applyLang();
renderAll();
</script>
